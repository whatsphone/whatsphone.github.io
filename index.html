<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Open Phone Number In WhatsApp - Enter a valid phone number to get a direct WhatsApp link.">
    <title>Open Phone Number In WhatsApp</title>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=c9de5a53">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=d51b8c51">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=cd93aa5c">
	<link rel="manifest" href="/site.webmanifest?v=430cc18a">
	<link rel="mask-icon" href="/safari-pinned-tab.svg?v=10dcadb6" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#f8f9fa">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.2.3/dist/css/intlTelInput.min.css"
          integrity="sha384-ruvLdWaS29qgQGLHa/gi6V/P9MwCbrkXvxho56yVUG0jK7dbAw14X15Bs4ck4mji" crossorigin="anonymous">
    <!-- intlTelInputWithUtils bundles the formatting/validation utils, so they are
         available synchronously rather than as a second, racy async download. -->
    <script defer src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.2.3/dist/js/intlTelInputWithUtils.min.js"
            integrity="sha384-93hWm2TFsMO02u5ah7ei/BLy5FX/nVzF2TDVfDDlXrb2VWecCH1tjRMgUe5nJlne" crossorigin="anonymous"></script>
	<!-- Google Fonts serves different CSS per user agent, so it cannot carry an integrity hash. -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"
          integrity="sha384-6PPM9FQ/C8Yhl7I7MGkHjRp8AtDT2AYsSAySNhhWfpqLZ4rIzqjOhZulS91Vt+84" crossorigin="anonymous">
    <style>
        :root {
            --page-bg: #f8f9fa;
            --card-bg: #ffffff;
            --footer-bg: #e9ecef;
            --line: #dee2e6;
            --brand: #1a8a34;
            --brand-dark: #15702a;
            --ink: #212529;
            --muted: #6c757d;
            --footer-height: 3.25rem;
        }
        body {
            background-color: var(--page-bg);
            color: var(--ink);
            /* Keep content clear of the fixed footer. */
            padding-bottom: calc(var(--footer-height) + 1rem);
        }
        /* Sit the app a quarter of the way down: the leftover vertical space is
           split 1:3 above and below, so it reads as high on the page at any
           height. (A flat 25vh top padding measures 25% but still looks centred,
           because the content block itself is ~340px tall.) Bootstrap's .py-5
           sets padding with !important, so that class is off the element and the
           vertical padding is set here instead. */
        main.container {
            min-height: calc(100vh - var(--footer-height) - 1rem);
            display: flex;
            flex-direction: column;
            padding-top: 1.5rem;
            padding-bottom: 3rem;
        }
        main.container::before {
            content: "";
            flex: 1;
        }
        main.container::after {
            content: "";
            flex: 3;
        }
        .input-group {
            width: 100%;
            /* Bootstrap wraps input groups by default, which drops the Paste
               button onto its own line on narrow screens. Keep it on one line and
               let the number field absorb the difference instead. */
            flex-wrap: nowrap;
        }
        .input-group .iti {
            display: flex;
            flex-grow: 1;
            min-width: 0; /* Allow the field to shrink below its intrinsic width. */
        }
        .input-group .iti > .form-control {
            width: 100%;
            min-width: 0;
        }
        .input-group .btn {
            z-index: 3;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            /* With flex-wrap: nowrap above, the button would otherwise be squeezed
               until its label broke onto a second line and made the row taller.
               Keep it at its natural width; the number field absorbs the shrink. */
            flex-shrink: 0;
            white-space: nowrap;
        }
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .alert-custom {
            border-radius: 0.375rem;
            padding: 1rem 1.25rem;
            display: block; /* Initially show the alert */
            margin-bottom: 1rem;
        }
        /* The resting state is guidance, not an alert, so keep it quiet. Errors
           (danger) and clipboard failures (warning) keep their Bootstrap colours. */
        #info-text.alert-primary {
            background-color: #f1f3f5;
            border-color: var(--line);
            color: var(--muted);
            padding: 0.75rem 1.25rem;
        }
        .app-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        /* The logo sits in its own tile so it reads as a mark rather than an
           image dropped next to the text. */
        .app-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5.25rem;
            height: 5.25rem;
            margin-bottom: 1.125rem;
            background-color: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            box-shadow: 0 6px 18px rgba(26, 138, 52, 0.13);
        }
        .app-logo img {
            display: block;
            width: auto;
            height: 3.25rem;
        }
		h1 {
			font-family: 'Roboto', sans-serif;
            font-weight: 700;
			color: var(--brand);
            font-size: clamp(1.6rem, 5.2vw, 2.5rem);
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .tagline {
            color: var(--muted);
            font-size: clamp(0.95rem, 2.6vw, 1.125rem);
            margin: 0.65rem auto 0;
            max-width: 34rem;
        }
        /* Tie the call to action to the title colour rather than Bootstrap green. */
        #whatsapp-link {
            background-color: var(--brand);
            border-color: var(--brand);
            font-weight: 600;
            padding-top: 0.7rem;
            padding-bottom: 0.7rem;
        }
        #whatsapp-link:hover,
        #whatsapp-link:focus-visible {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
        }
        /* Restore the v17 country selector. v29 renders it flat, reorders it to
           flag > arrow > dial code, and draws the arrow as a thin rotated chevron.
           This puts back the shaded block, the flag > dial code > arrow order and
           the solid triangle, matching the old layout to the pixel. */
        .iti__selected-country {
            background-color: rgba(0, 0, 0, 0.05);
            border-top-left-radius: 0.375rem;
            border-bottom-left-radius: 0.375rem;
            padding: 0 6px 0 8px;
        }
        .iti__selected-country-primary {
            display: contents; /* Let the flag and arrow order independently. */
        }
        .iti__selected-country .iti__flag {
            order: 1;
        }
        .iti__selected-country .iti__selected-dial-code {
            order: 2;
            margin-left: 6px;
        }
        .iti__selected-country .iti__arrow {
            order: 3;
            margin-left: 6px;
            margin-top: 0;
            width: 0;
            height: 0;
            border: 0;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-top: 4px solid #555;
            transform: none;
        }
        .iti__selected-country .iti__arrow--up {
            border-top: 0;
            border-bottom: 4px solid #555;
        }
		footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            /* Below intl-tel-input's dropdown (z-index 1060) so the country list
               is never covered by the band. */
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: var(--footer-height);
            padding: 0.6rem 1rem;
            /* Sits on the page background, one step darker. */
            background-color: var(--footer-bg);
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.95rem;
        }
        footer a {
            text-decoration: none;
            color: #495057;
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        footer a:hover,
        footer a:focus-visible {
            color: var(--ink);
            background-color: rgba(0, 0, 0, 0.06);
        }
        footer .bi {
            vertical-align: -0.125em;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <main class="container">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<header class="app-header">
					<span class="app-logo">
						<img src="/whatsapp.svg?v=dd6a4db2" alt="WhatsApp Logo">
					</span>
					<h1>Open Phone Number In WhatsApp</h1>
					<p class="tagline">Message any number without saving it to your contacts.</p>
				</header>
			</div>
		</div>
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="input-group mb-3">
                    <!-- Set explicitly: left alone, intl-tel-input v29 would apply
                         autocomplete="tel", which makes the browser offer its own
                         autofill dropdown over the field. v17 applied "off". -->
                    <input type="tel" class="form-control" id="phone-number" placeholder="Enter phone number" autocomplete="off">
                    <button class="btn btn-outline-secondary" id="paste-button" type="button">
                        <i class="bi bi-clipboard"></i> Paste
                    </button>
                </div>
                <div id="info-text" class="alert alert-primary alert-custom">Please enter a phone number.</div>
                <div class="d-grid gap-2">
                    <a id="whatsapp-link" class="btn btn-success btn-lg" style="display: none;" target="_blank" rel="noopener noreferrer">Open in WhatsApp</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://github.com/whatsphone/whatsphone.github.io/tree/main" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-github" role="img" aria-label="GitHub"></i> View on GitHub
        </a>
    </footer>
    <script>
document.addEventListener('DOMContentLoaded', async function () {
    const input = document.querySelector("#phone-number");
    const infoText = document.querySelector("#info-text");
    const whatsappLink = document.querySelector("#whatsapp-link");
    const pasteButton = document.querySelector("#paste-button");

    function showMessage(kind, text) {
        infoText.className = `alert alert-${kind} alert-custom`;
        infoText.textContent = text;
        infoText.style.display = 'block';
    }

    // Subresource integrity makes the CDN fail closed, so say something useful
    // rather than leaving an inert page behind.
    if (typeof intlTelInput === 'undefined') {
        showMessage('danger', 'Could not load the phone number library. Please refresh the page.');
        return;
    }

    // Formatting and validation ship inside intlTelInputWithUtils, so they are
    // available synchronously and nothing has to wait on a second download.
    const iti = intlTelInput(input, {
        initialCountry: 'us',
        countryOrder: ['us', 'gb'],
        dropdownParent: document.body,
        separateDialCode: true,
        // v29 adds a search field to the dropdown, which browsers offer to autofill.
        // The original design had no search box.
        countrySearch: false,
        // Accept any valid number type, matching the previous behaviour rather
        // than the v29 default of mobile and fixed line only.
        allowedNumberTypes: null
    });

    const COUNTRY_COOKIE = 'ipCountryData';

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    // setSelectedCountry() throws on an unrecognised code, so check first.
    function isKnownCountry(iso2) {
        if (!/^[a-z]{2}$/.test(iso2 || '')) return false;
        return intlTelInput.getAllCountries().some(c => c.iso2 === iso2);
    }

    // Each provider yields an ISO 3166-1 alpha-2 code. They are tried in order, so a
    // rate-limited or reshaped response falls through to the next one instead of
    // silently leaving the user on initialCountry.
    const GEO_PROVIDERS = [
        { url: 'https://get.geojs.io/v1/ip/country.json', parse: r => r.country },
        { url: 'https://ipwho.is/', parse: r => r.country_code },
        // ipapi.is exposed location.country_code on its older payload and omits any
        // code on the current free tier; accept either shape.
        { url: 'https://api.ipapi.is', parse: r => (r.location && r.location.country_code) || r.country_code }
    ];

    async function fetchCountryFromIP() {
        for (const provider of GEO_PROVIDERS) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 4000);
                let response;
                try {
                    response = await fetch(provider.url, { signal: controller.signal });
                } finally {
                    clearTimeout(timeout);
                }
                if (!response.ok) continue;
                const code = (provider.parse(await response.json()) || '').toLowerCase();
                if (isKnownCountry(code)) return code;
            } catch (err) {
                console.warn(`Country lookup failed via ${provider.url}:`, err);
            }
        }
        return null;
    }

    function readCachedCountry() {
        const raw = getCookie(COUNTRY_COOKIE);
        if (!raw) return null;
        let value = raw;
        try {
            value = decodeURIComponent(raw);
        } catch (err) { /* Not encoded, use as-is. */ }
        if (value.charAt(0) === '{') { // Cookie written by an earlier version.
            try {
                value = JSON.parse(value).isoCode || '';
            } catch (err) {
                return null;
            }
        }
        value = value.toLowerCase();
        return isKnownCountry(value) ? value : null;
    }

    async function setCountryFromIP() {
        const cached = readCachedCountry();
        if (cached) {
            iti.setSelectedCountry(cached);
            return;
        }
        const code = await fetchCountryFromIP();
        if (!code) return; // Keep the initialCountry fallback.
        // Don't yank the selector away from someone who started typing while the
        // lookup was still in flight.
        if (input.value.trim() === '') iti.setSelectedCountry(code);
        document.cookie = `${COUNTRY_COOKIE}=${encodeURIComponent(code)}; max-age=86400; path=/; SameSite=Lax`;
    }

    await setCountryFromIP();

    function cleanNumber(number) {
        return number.trim().replace(/[^+\d]+/g, '').replace(/(^\+)|\D+/g, '$1').replace(/^00/, '+');
    }

    function waLink() {
        return `https://wa.me/${iti.getNumber(intlTelInput.NUMBER_FORMAT.E164).replace(/\D/g, '')}`;
    }

    function updateLinkAndValidation() {
        if (input.value.trim() !== '' && iti.isValidNumber()) {
            whatsappLink.href = waLink();
            whatsappLink.style.display = 'block';
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            infoText.textContent = '';
            infoText.style.display = 'none';
        } else if (input.value.trim() === '') {
            input.classList.remove('is-invalid', 'is-valid');
            whatsappLink.style.display = 'none';
            showMessage('primary', 'Please enter a phone number.');
        } else {
            whatsappLink.style.display = 'none';
            input.classList.add('is-invalid');
            input.classList.remove('is-valid');
            showMessage('danger', 'Please enter a valid phone number.');
        }
    }

    function handleHashChange() {
        const hash = window.location.hash;
        if (!hash) return;
        // The browser percent-encodes separators in the fragment, so a number like
        // "#+33 6 12 34 56 78" arrives as "#+33%206%2012...". Decoding first stops
        // the digits of those escapes leaking into the number.
        let decodedHash = hash;
        try {
            decodedHash = decodeURIComponent(hash);
        } catch (err) { /* Malformed escape sequence: fall back to the raw hash. */ }
        // Regular expression to keep '+' at the beginning and digits only
        const numericHash = cleanNumber(decodedHash);
        if (!numericHash) return;

        iti.setNumber(numericHash);
        if (!hash.startsWith('##')) { // Single hash: just prepopulate the field.
            updateLinkAndValidation();
            return;
        }
        // Double hash: open WhatsApp directly.
        if (iti.isValidNumber()) {
            window.location.href = waLink();
        } else {
            console.error('Invalid number for direct WhatsApp open:', numericHash);
            updateLinkAndValidation(); // Surface the error in the UI, not just the console.
        }
    }

    handleHashChange(); // Call on initial load
    window.onhashchange = handleHashChange; // Also react to hash changes

    pasteButton.onclick = async function () {
        try {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                throw new Error('Clipboard API unavailable');
            }
            const text = await navigator.clipboard.readText();
            iti.setNumber(cleanNumber(text));
            updateLinkAndValidation();
        } catch (err) {
            // Firefox and Safari routinely refuse readText(), so tell the user
            // instead of appearing to do nothing at all.
            console.error('Failed to read clipboard contents:', err);
            showMessage('warning', 'Could not read the clipboard. Please paste into the field manually.');
            input.focus();
        }
    };

    // strictMode filters stray characters and formatAsYouType preserves the caret,
    // so the value no longer needs rewriting on every keystroke.
    input.addEventListener('input', updateLinkAndValidation);

    input.addEventListener('countrychange', function () {
        if (input.value.trim() !== '') updateLinkAndValidation();
    });

    const countrySelector = document.querySelector('.iti__selected-country');
    if (countrySelector) {
        countrySelector.addEventListener('click', function () {
            input.focus();
            updateLinkAndValidation();
        });
    }
});
    </script>
</body>
</html>
